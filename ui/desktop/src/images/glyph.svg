<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monochrome OpenSearch glyph for menu-bar templates. ImageMagick will
       convert this to iconTemplate.png at small sizes; macOS uses pure black
       and re-tints based on dark-mode. -->
  <g transform="translate(300 300)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#101010" stroke-width="68" stroke-linecap="round"
            stroke-dasharray="960 440"
            transform="rotate(-30)"/>
    <circle cx="170" cy="-100" r="38" fill="#101010"/>
  </g>
</svg>
