<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="2048" height="2048" viewBox="0 0 2048 2048" xmlns="http://www.w3.org/2000/svg">
  <!-- OpenSearch-themed app icon. Rounded square background with the
       OpenSearch wordmark "O" - a stylized open ring with an offset
       comma/tail, in OpenSearch teal on white. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F4F8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005EB8"/>
      <stop offset="100%" stop-color="#003B5C"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005EB8"/>
      <stop offset="100%" stop-color="#003B5C"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="200" y="200" width="1648" height="1648" rx="400" ry="400" fill="url(#bg)" stroke="none"/>

  <!-- The OpenSearch "O": an open ring with a kink that suggests motion / search -->
  <g transform="translate(1024 1024)">
    <!-- main ring -->
    <circle cx="0" cy="0" r="500" fill="none" stroke="url(#ring)" stroke-width="170" stroke-linecap="round"
            stroke-dasharray="2400 1100"
            transform="rotate(-30)"/>
    <!-- inner accent dot at the broken end of the ring (the "search" dot) -->
    <circle cx="430" cy="-250" r="95" fill="url(#tail)"/>
  </g>
</svg>
